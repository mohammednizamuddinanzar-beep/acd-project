steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/ai-workflow-compiler-agent:$SHORT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/ai-workflow-compiler-agent:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/ai-workflow-compiler-agent:$SHORT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/ai-workflow-compiler-agent:latest"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "ai-workflow-compiler-agent"
      - "--image"
      - "gcr.io/$PROJECT_ID/ai-workflow-compiler-agent:$SHORT_SHA"
      - "--region"
      - "asia-south1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--concurrency"
      - "15"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "30"
      - "--timeout"
      - "300"

images:
  - "gcr.io/$PROJECT_ID/ai-workflow-compiler-agent:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/ai-workflow-compiler-agent:latest"
