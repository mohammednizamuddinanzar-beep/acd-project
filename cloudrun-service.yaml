apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ai-workflow-compiler-agent
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "30"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 15
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/ai-workflow-compiler-agent:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
